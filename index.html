<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F0">
<meta name="description" content="Jeder Raum eine Karteikarte: Räume, Plätze und alles, was darin liegt – mit Suche und Fotos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lager">
<title>Lager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen)
  try{var t=localStorage.getItem('lager.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
</head>
<body>
<main id="view" aria-live="polite"></main>

<nav id="nav" class="nav" aria-label="Hauptnavigation">
  <a href="#/" data-tab="home" class="nav-i">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h3V6h6v3h9v11H3z M3 14h7v-2h6v2h5"/></svg>
    <span>Zuhause</span>
  </a>
  <a href="#/search" data-tab="search" class="nav-i">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <span>Suchen</span>
  </a>
  <button class="nav-add" data-a="addItem" aria-label="Ding einräumen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <a href="#/lists" data-tab="lists" class="nav-i">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l2 4v14H5V7z M5 7h14 M10 11h4"/></svg>
    <span>Listen</span>
  </a>
  <a href="#/more" data-tab="more" class="nav-i">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    <span>Mehr</span>
  </a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-a="closeSheet"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <h2 id="sheetTitle"></h2>
    <div class="sheet-body"></div>
    <div class="sheet-foot"></div>
  </div>
</div>

<div id="cam" class="cam" hidden>
  <video playsinline muted autoplay></video>
  <div class="cam-frame"></div>
  <div class="cam-hint" hidden></div>
  <div class="cam-bar">
    <button class="cam-x" data-a="camClose" aria-label="Kamera schließen">✕</button>
    <button class="cam-shot" data-a="camShot" aria-label="Foto aufnehmen"></button>
    <button class="cam-type" data-a="camType">Nummer eintippen</button>
    <button class="cam-gal" data-a="camGallery" aria-label="Aus Galerie wählen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
    </button>
  </div>
</div>

<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Foto im Vollbild">
  <div class="vw-track"></div>
  <button class="vw-x" data-a="closeViewer" aria-label="Schließen">✕</button>
  <div class="vw-count"></div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<input id="filePick" type="file" accept="image/*" hidden>
<input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
<input id="fileBackup" type="file" accept="application/json,.json,text/plain,.txt" hidden>

<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
