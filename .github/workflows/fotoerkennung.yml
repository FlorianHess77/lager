name: Fotoerkennung vorbereiten

# Lädt das Erkennungsmodell und die Laufzeit herunter, berechnet die Fingerabdrücke
# für den Wortschatz (tools/clip-vocab.mjs) und legt alles im Repo ab.
# GitHub Pages liefert die Dateien danach direkt mit aus.
on:
  push:
    branches: [main]
    paths:
      - tools/clip-vocab.mjs
      - tools/prepare-clip.mjs
      - .github/workflows/fotoerkennung.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fotoerkennung
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Transformers.js und ONNX-Laufzeit holen
        run: |
          mkdir -p /tmp/hf vendor/transformers vendor/ort
          echo '{"private":true}' > /tmp/hf/package.json
          npm install --no-audit --no-fund --prefix /tmp/hf @huggingface/transformers@3
          H=/tmp/hf/node_modules
          cp $H/@huggingface/transformers/dist/transformers.min.js vendor/transformers/
          ORT=$(dirname $(node -p "require.resolve('onnxruntime-web/package.json', {paths:['$H/@huggingface/transformers']})"))/dist
          ls $ORT
          rm -f vendor/ort/*
          cp $ORT/ort-wasm-simd-threaded.jsep.mjs $ORT/ort-wasm-simd-threaded.jsep.wasm vendor/ort/ 2>/dev/null || true
          cp $ORT/ort-wasm-simd-threaded.mjs $ORT/ort-wasm-simd-threaded.wasm vendor/ort/ 2>/dev/null || true
          ls -la vendor/transformers vendor/ort

      - name: Modell und Fingerabdrücke vorbereiten
        run: node tools/prepare-clip.mjs /tmp/hf

      - name: Ergebnis ins Repo legen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add models vendor/transformers vendor/ort
          if git diff --cached --quiet; then echo "Nichts geändert"; exit 0; fi
          git commit -m "Fotoerkennung: Modell und Wortschatz aktualisiert"
          git pull --rebase origin main
          git push
